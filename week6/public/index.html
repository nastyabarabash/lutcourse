<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
</head>

<body>
  <h1>Todo App</h1>

  <form id="todoForm">
    <input type="text" id="userInput" placeholder="Enter name" required>
    <input type="text" id="todoInput" placeholder="Enter todo" required>
    <button type="submit" id="submit-data">Add Todo</button>
  </form>

  <hr>

  <form id="searchForm">
    <input type="text" id="searchInput" placeholder="Search user" required>
    <button type="submit" id="search">Search</button>
  </form>

  <div id="userSection" style="display:none;">
    <h2>Todos for <span id="userName"></span></h2>
    <ul id="todoList"></ul>
    <button id="deleteUser">Delete User</button>
  </div>

  <p id="message"></p>

  <script src="../js/index.js" defer></script>
</body>

</html>
